name: Temporary core pages NAP and pricing QA
on:
  push:
    branches: [feat/pt-main-page-contact-prices-20261014]
    paths: [.github/workflows/pt-core-facts-qa-temp.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pt-core-facts-20261014
  cancel-in-progress: false

jobs:
  build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Snapshot exactly 300 published article HTML hashes before rebuild
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const state=JSON.parse(fs.readFileSync('data/factory-state.json','utf8'));
          const plan=JSON.parse(fs.readFileSync('data/editorial-plan.json','utf8'));
          if(state.published_ids.length!==300)throw new Error('Expected 300 articles on main');
          const byId=new Map(plan.topics.map(t=>[t.id,t.target_url]));
          const lines=[];
          for(const id of state.published_ids) {
            const u=byId.get(id);
            if(!u)throw Error('Unknown published ID '+id);
            const f=u==='/'?'index.html':u.slice(1)+'index.html';
            const b=fs.readFileSync(f);
            lines.push(crypto.createHash('sha256').update(b).digest('hex')+'  '+f);
          }
          fs.writeFileSync('/tmp/pt-article-html-hashes.sha256',lines.join('\n')+'\n');
          console.log('Protected article HTML files:',lines.length);
          JS
      - name: Rebuild only from approved core page sources
        run: npm run build
      - name: Article immutability guard
        run: |
          sha256sum -c --status /tmp/pt-article-html-hashes.sha256
          if git diff --name-only | grep -E '^content/articles/|^data/(factory-state|editorial-plan)\.json'; then
            echo 'Article source or editorial state unexpectedly modified'; exit 1
          fi
          echo 'All 300 published article HTML files are byte-for-byte unchanged.'
      - name: Verify generated SEO, links and sitemap
        run: npm run check
      - name: Test repository and factory
        run: npm test
      - name: Validate main page contact details and electric price restrictions
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const shop=JSON.parse(fs.readFileSync('site/data.json','utf8')).business;
          const paths=[
            'index.html','contactos/index.html','precos/index.html',
            'tipos-de-motas/index.html','tipos-de-motas/scooters/index.html',
            'tipos-de-motas/motas-50cc/index.html','guia-de-aluguer/index.html',
            'guia-de-aluguer/documentacao-e-caucao/index.html','sobre-nos/index.html'
          ];
          for(const p of paths){
            const html=fs.readFileSync(p,'utf8');
            for(const [label,word] of [['name',shop.canonicalName],['phone',shop.phone.display],['address',shop.address.display],['hours',shop.hours.display],['WhatsApp',shop.whatsapp.url],['Zalo',shop.zalo.url],['Maps',shop.maps]]){
              assert.ok(html.includes(word),p+' missing '+label+': '+word);
            }
            assert.ok(!html.includes('class="float-contact"'),p+' restored legacy dock');
          }
          const prices=fs.readFileSync('precos/index.html','utf8');
          const types=fs.readFileSync('tipos-de-motas/index.html','utf8');
          assert.ok(prices.includes('sob consulta') && types.includes('sob consulta'));
          assert.ok(shop.whatsapp.url.endsWith('84942467674'));
          console.log('Verified NAP, hours, 4 contacts and price disclaimers on '+paths.length+' main pages.');
          JS
      - name: Commit ONLY regenerated core pages and shared search indexes
        run: |
          git config user.name "pt-core-facts-qa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --name-only > /tmp/pt-core-changed-paths.txt
          if grep -E '^content/articles/|^data/(factory-state|editorial-plan)\.json' /tmp/pt-core-changed-paths.txt; then
            echo 'Prohibited source modification'; exit 1
          fi
          if git diff --cached --quiet; then echo "No regenerated changes"; exit 0; fi
          git commit -m "build(pt): regenerate only core landing pages with verified NAP and pricing"
          git push origin HEAD:feat/pt-main-page-contact-prices-20261014
