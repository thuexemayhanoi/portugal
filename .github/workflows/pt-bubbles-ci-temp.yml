name: Temporary Portuguese AI bubbles build
on:
  push:
    branches: [feat/pt-local-assistant-quick-contact-20261014]
    paths: [.github/workflows/pt-bubbles-ci-temp.yml, scripts/build.mjs, scripts/lib/layout.mjs, src/js/floating.js]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pt-bubbles-qa-20261014
  cancel-in-progress: false
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Syntax checks for all local scripts
        run: |
          node --check scripts/build.mjs
          node --check scripts/lib/layout.mjs
          node --check src/js/assistant.js
          node --check src/js/pt-assistant-adapter.js
          node --check src/js/floating.js
      - name: Build output
        run: npm run build
      - name: Verify generated site, links, schema and 300 articles
        run: npm run check
      - name: Run automated tests
        run: npm test
      - name: Commit generated output on this branch
        run: |
          git config user.name "pt-bubbles-qa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add assets/chat/search-index.json assets/js/business-config.js assets/js/assistant.js assets/js/pt-assistant-adapter.js assets/js/floating.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "build(pt): generate 300-page Blue Titanium assistant and contact bubbles"
          git push origin HEAD:feat/pt-local-assistant-quick-contact-20261014
