name: Temporary trust pages build and QA
on:
  push:
    branches:
      - feat/pt-navigation-trust-pages-20261014
    paths:
      - .github/workflows/pt-trust-pages-rebuild-temp.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pt-trust-pages-rebuild-20261014
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build pages and assets from source data
        run: npm run build
      - name: Verify generated files and SEO content
        run: npm run check
      - name: Run unit tests
        run: npm test
      - name: Commit regenerated site output only
        run: |
          git config user.name "pt-site-qa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "build(pt): regenerate 300-article site with expanded trust pages and navigation"
          git push origin HEAD:feat/pt-navigation-trust-pages-20261014
