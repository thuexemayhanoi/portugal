name: Temporary Portuguese price rebuild
on:
  push:
    branches:
      - feat/pt-seo-blog-foundation
    paths:
      - site/data.json
      - content/articles/PT-0047.json
      - .github/workflows/pt-price-rebuild-temp.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-portuguese-price-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Regenerate and verify
        run: |
          npm run build
          npm run check
      - name: Commit only regenerated site output
        run: |
          git config user.name "pt-price-qa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "build: regenerate Portuguese pages using verified pricing"
          git push origin HEAD:feat/pt-seo-blog-foundation
