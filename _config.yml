# GitHub Pages (deploy from branch main, root). The site is pre-generated by `npm run build`;
# Jekyll only copies files. These source folders are excluded from the public site.
# Jekyll matches `exclude` entries by prefix ("site" also hides "sitemap.xml"), so public files
# that share a prefix are listed in `include`. scripts/qa-site.mjs checks both lists.
exclude:
  - AGENTS.md
  - CHANGELOG.md
  - README.md
  - package.json
  - content
  - data
  - docs
  - factory
  - reports
  - scripts
  - site
  - src
include:
  - sitemap.xml
